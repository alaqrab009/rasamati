<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رسماتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

  <header class="top">
    <h1 id="siteTitle">رسماتي</h1>
    <p id="siteSubtitle"></p>
  </header>

  <main>
    <div class="search-row">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث برقم المنتج أو اسمه...">
      </div>
      <div class="cat-dropdown" id="catDropdownWrap">
        <button type="button" class="cat-dropdown-btn" id="catDropdownBtn">
          <span id="catDropdownLabel">الأقسام</span>
          <span class="caret">▾</span>
        </button>
        <div class="cat-dropdown-menu" id="catDropdownMenu"></div>
      </div>
    </div>
    <div class="cat-tabs" id="catTabs"></div>
    <div class="grid" id="productsGrid"></div>
    <p class="empty" id="emptyMsg" style="display:none;">لا توجد منتجات مطابقة</p>
  </main>

  <footer>
    <p id="siteFooter"></p>
    <a class="admin-link" href="admin.html">إدارة</a>
  </footer>

  <div class="lightbox" id="lightbox">
    <button type="button" class="lb-close" id="lbClose" aria-label="إغلاق">&times;</button>
    <button type="button" class="lb-nav lb-prev" id="lbPrev" aria-label="الصورة السابقة">&#10094;</button>
    <button type="button" class="lb-nav lb-next" id="lbNext" aria-label="الصورة التالية">&#10095;</button>
    <div class="lb-stage" id="lbStage">
      <img id="lbImg" src="" alt="" draggable="false">
    </div>
    <div class="lb-zoom-bar">
      <button type="button" id="lbZoomOut" aria-label="تصغير">−</button>
      <span id="lbZoomLevel">100%</span>
      <button type="button" id="lbZoomIn" aria-label="تكبير">+</button>
    </div>
    <span class="lb-count" id="lbCount"></span>
  </div>

  <script>
    var DATA = null;
    var grid = document.getElementById('productsGrid');
    var emptyMsg = document.getElementById('emptyMsg');
    var searchInput = document.getElementById('searchInput');
    var catTabs = document.getElementById('catTabs');
    var ALL = 'الكل';
    var NONE = 'بدون قسم';
    var activeCategory = ALL;

    function siteBase() {
      var u = window.location.href.split('?')[0].split('#')[0];
      return u.substring(0, u.lastIndexOf('/') + 1);
    }

    function imageDetails(p, idx) {
      var d = (p.details && p.details[idx]) || {};
      return { name: d.name || p.name || '', size: d.size || '', description: d.description || '' };
    }

    function productImages(p) {
      if (p.images && p.images.length) { return p.images; }
      if (p.image) { return [p.image]; }
      return [];
    }

    /* ---------- صندوق تكبير الصورة ---------- */

    var lb = {
      el: document.getElementById('lightbox'),
      stage: document.getElementById('lbStage'),
      img: document.getElementById('lbImg'),
      count: document.getElementById('lbCount'),
      zoomLevel: document.getElementById('lbZoomLevel'),
      imgs: [],
      index: 0,
      scale: 1,
      x: 0,
      y: 0
    };

    var MIN_SCALE = 1;
    var MAX_SCALE = 4;

    function lbApply(animate) {
      lb.img.style.transition = animate ? 'transform 0.18s ease' : 'none';
      lb.img.style.transform = 'translate(' + lb.x + 'px,' + lb.y + 'px) scale(' + lb.scale + ')';
      lb.img.style.cursor = lb.scale > 1 ? 'grab' : 'zoom-in';
      lb.zoomLevel.textContent = Math.round(lb.scale * 100) + '%';
    }

    function lbClampPan() {
      if (lb.scale <= 1) { lb.x = 0; lb.y = 0; return; }
      var maxX = (lb.stage.clientWidth * (lb.scale - 1)) / 2;
      var maxY = (lb.stage.clientHeight * (lb.scale - 1)) / 2;
      lb.x = Math.max(-maxX, Math.min(maxX, lb.x));
      lb.y = Math.max(-maxY, Math.min(maxY, lb.y));
    }

    function lbSetScale(newScale, animate) {
      lb.scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
      lbClampPan();
      lbApply(animate);
    }

    function lbShow(i) {
      lb.index = (i + lb.imgs.length) % lb.imgs.length;
      lb.img.src = lb.imgs[lb.index];
      lb.scale = 1;
      lb.x = 0;
      lb.y = 0;
      lbApply(false);
      lb.count.textContent = lb.imgs.length > 1 ? (lb.index + 1) + '/' + lb.imgs.length : '';
      var multi = lb.imgs.length > 1;
      document.getElementById('lbPrev').style.display = multi ? 'flex' : 'none';
      document.getElementById('lbNext').style.display = multi ? 'flex' : 'none';
    }

    function openLightbox(imgs, startIndex) {
      lb.imgs = imgs;
      document.body.style.overflow = 'hidden';
      lb.el.classList.add('open');
      lbShow(startIndex || 0);
    }

    function closeLightbox() {
      lb.el.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('lbClose').onclick = closeLightbox;
    document.getElementById('lbPrev').onclick = function (e) { e.stopPropagation(); lbShow(lb.index - 1); };
    document.getElementById('lbNext').onclick = function (e) { e.stopPropagation(); lbShow(lb.index + 1); };
    document.getElementById('lbZoomIn').onclick = function (e) { e.stopPropagation(); lbSetScale(lb.scale + 0.6, true); };
    document.getElementById('lbZoomOut').onclick = function (e) { e.stopPropagation(); lbSetScale(lb.scale - 0.6, true); };

    lb.el.addEventListener('click', function (e) {
      if (e.target === lb.el) { closeLightbox(); }
    });

    document.addEventListener('keydown', function (e) {
      if (!lb.el.classList.contains('open')) { return; }
      if (e.key === 'Escape') { closeLightbox(); }
      else if (e.key === 'ArrowLeft') { lbShow(lb.index - (document.dir === 'rtl' ? -1 : 1)); }
      else if (e.key === 'ArrowRight') { lbShow(lb.index + (document.dir === 'rtl' ? -1 : 1)); }
      else if (e.key === '+') { lbSetScale(lb.scale + 0.6, true); }
      else if (e.key === '-') { lbSetScale(lb.scale - 0.6, true); }
    });

    /* التكبير بعجلة الفأرة */
    lb.stage.addEventListener('wheel', function (e) {
      if (!lb.el.classList.contains('open')) { return; }
      e.preventDefault();
      var delta = e.deltaY > 0 ? -0.3 : 0.3;
      lbSetScale(lb.scale + delta, false);
    }, { passive: false });

    /* فأرة ولمس موحّدان عبر Pointer Events:
       - إصبع واحد / فأرة مع الضغط والسحب: تحريك الصورة عند التكبير
       - إصبعان (pinch): تكبير وتصغير باللمس
       - نقرة/لمسة مزدوجة سريعة بلا تحريك: تبديل التكبير 1x <-> 2.4x */
    var activePointers = {};
    var activeCount = 0;
    var pinchActive = false, pinchStartDist = 0, pinchStartScale = 1;
    var panId = null, panStartX = 0, panStartY = 0, panOrigX = 0, panOrigY = 0;
    var tapCandidate = null;
    var lastTapTime = 0;

    function dist2(a, b) {
      var dx = a.x - b.x, dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    lb.stage.addEventListener('pointerdown', function (e) {
      activePointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      activeCount = Object.keys(activePointers).length;

      if (activeCount === 2) {
        var ids = Object.keys(activePointers);
        pinchActive = true;
        pinchStartDist = dist2(activePointers[ids[0]], activePointers[ids[1]]);
        pinchStartScale = lb.scale;
        panId = null;
        tapCandidate = null;
      } else if (activeCount === 1) {
        pinchActive = false;
        panId = e.pointerId;
        panStartX = e.clientX; panStartY = e.clientY;
        panOrigX = lb.x; panOrigY = lb.y;
        tapCandidate = { x: e.clientX, y: e.clientY, time: Date.now() };
      }
    });

    lb.stage.addEventListener('pointermove', function (e) {
      if (!(e.pointerId in activePointers)) { return; }
      activePointers[e.pointerId] = { x: e.clientX, y: e.clientY };

      if (pinchActive && activeCount === 2) {
        var ids = Object.keys(activePointers);
        var d = dist2(activePointers[ids[0]], activePointers[ids[1]]);
        if (pinchStartDist > 0) { lbSetScale(pinchStartScale * (d / pinchStartDist), false); }
        return;
      }

      if (panId === e.pointerId) {
        if (tapCandidate) {
          var movedFar = Math.abs(e.clientX - tapCandidate.x) > 8 || Math.abs(e.clientY - tapCandidate.y) > 8;
          if (movedFar) { tapCandidate = null; }
        }
        if (lb.scale > 1) {
          lb.x = panOrigX + (e.clientX - panStartX);
          lb.y = panOrigY + (e.clientY - panStartY);
          lbClampPan();
          lbApply(false);
        }
      }
    });

    function pointerEnd(e) {
      delete activePointers[e.pointerId];
      activeCount = Object.keys(activePointers).length;
      if (activeCount < 2) { pinchActive = false; }

      if (panId === e.pointerId) {
        if (tapCandidate && (Date.now() - tapCandidate.time) < 300) {
          var now = Date.now();
          if (now - lastTapTime < 350) {
            lbSetScale(lb.scale > 1 ? 1 : 2.4, true);
            lastTapTime = 0;
          } else {
            lastTapTime = now;
          }
        }
        panId = null;
        tapCandidate = null;
      }
    }

    lb.stage.addEventListener('pointerup', pointerEnd);
    lb.stage.addEventListener('pointercancel', pointerEnd);

    function buildWhatsappLink(p, idx) {
      var imgs = productImages(p);
      var d = imageDetails(p, idx || 0);
      var imageUrl = imgs.length ? (siteBase() + imgs[idx || 0]) : '';
      var msg = 'السلام عليكم، أبغى أطلب المنتج رقم ' + p.id + '\n' +
                'الاسم: ' + d.name +
                (d.size ? '\nالمقاس: ' + d.size : '') +
                (imageUrl ? '\nرابط الصورة: ' + imageUrl : '');
      return 'https://wa.me/' + DATA.whatsapp + '?text=' + encodeURIComponent(msg);
    }

    var bgItems = [];
    var bgToken = 0;
    var warmed = {};
    var warmRefs = [];

    function warm(src, cb) {
      var im = new Image();
      warmRefs.push(im);
      im.onload = function () { warmed[src] = true; if (cb) { cb(); } };
      im.onerror = function () { if (cb) { cb(); } };
      im.src = src;
    }

    function startBackgroundLoading(token) {
      var items = bgItems.slice().sort(function (a, b) { return a.idx - b.idx || a.order - b.order; });
      var pos = 0;
      var active = 0;
      var MAX_PARALLEL = 3;
      function next() {
        if (token !== bgToken) { return; }
        while (active < MAX_PARALLEL && pos < items.length) {
          var src = items[pos++].src;
          if (warmed[src]) { continue; }
          active++;
          warm(src, function () { active--; next(); });
        }
      }
      next();
    }

    function buildCarousel(p, onChange) {
      var imgs = productImages(p);
      var wrap = document.createElement('div');
      wrap.className = 'img-wrap';

      var main = document.createElement('img');
      main.className = 'main-img';
      main.decoding = 'async';
      main.draggable = false;
      main.addEventListener('load', function () { warmed[main.getAttribute('src')] = true; });
      wrap.appendChild(main);

      var spinner = document.createElement('div');
      spinner.className = 'img-spinner';
      spinner.style.display = 'none';
      wrap.appendChild(spinner);

      var current = 0;
      var req = 0;
      var dots = null;
      var countBadge = null;

      imgs.forEach(function (src, i) {
        if (i > 0) { bgItems.push({ src: src, idx: i, order: bgItems.length }); }
      });

      main.onclick = function (e) {
        e.stopPropagation();
        if (imgs.length) { openLightbox(imgs, current); }
      };

      function applyUi() {
        if (dots) {
          Array.prototype.forEach.call(dots.children, function (d, k) {
            d.classList.toggle('active', k === current);
          });
        }
        if (countBadge) { countBadge.textContent = (current + 1) + '/' + imgs.length; }
        main.alt = imageDetails(p, current).name;
        if (onChange) { onChange(current); }
      }

      function fade() {
        main.classList.remove('fade');
        void main.offsetWidth;
        main.classList.add('fade');
      }

      function show(i) {
        if (imgs.length === 0) { return; }
        current = (i + imgs.length) % imgs.length;
        var src = imgs[current];
        var my = ++req;
        applyUi();
        if (warmed[src]) {
          main.src = src;
          spinner.style.display = 'none';
          fade();
        } else {
          spinner.style.display = 'block';
          var tries = 0;
          (function attempt() {
            warm(src, function () {
              if (my !== req) { return; }
              if (!warmed[src] && tries < 1) { tries++; setTimeout(attempt, 600); return; }
              main.src = src;
              spinner.style.display = 'none';
              fade();
            });
          })();
        }
        [current + 1, current - 1].forEach(function (k) {
          var s = imgs[(k + imgs.length) % imgs.length];
          if (!warmed[s]) { warm(s); }
        });
      }

      if (imgs.length) { main.src = imgs[0]; }

      if (imgs.length > 1) {
        var prevBtn = document.createElement('button');
        prevBtn.type = 'button';
        prevBtn.className = 'nav-btn prev';
        prevBtn.innerHTML = '&#10094;';
        prevBtn.setAttribute('aria-label', 'الصورة السابقة');
        prevBtn.onclick = function (e) { e.stopPropagation(); show(current - 1); };

        var nextBtn = document.createElement('button');
        nextBtn.type = 'button';
        nextBtn.className = 'nav-btn next';
        nextBtn.innerHTML = '&#10095;';
        nextBtn.setAttribute('aria-label', 'الصورة التالية');
        nextBtn.onclick = function (e) { e.stopPropagation(); show(current + 1); };

        dots = document.createElement('div');
        dots.className = 'dots';
        imgs.forEach(function (_, k) {
          var d = document.createElement('span');
          d.className = 'dot' + (k === 0 ? ' active' : '');
          d.onclick = function (e) { e.stopPropagation(); show(k); };
          dots.appendChild(d);
        });

        countBadge = document.createElement('span');
        countBadge.className = 'count-badge';

        wrap.appendChild(prevBtn);
        wrap.appendChild(nextBtn);
        wrap.appendChild(dots);
        wrap.appendChild(countBadge);

        var startX = null;
        wrap.addEventListener('touchstart', function (e) {
          startX = e.touches[0].clientX;
        }, { passive: true });
        wrap.addEventListener('touchend', function (e) {
          if (startX === null) { return; }
          var diff = e.changedTouches[0].clientX - startX;
          if (Math.abs(diff) > 40) {
            if (diff > 0) { show(current - 1); } else { show(current + 1); }
          }
          startX = null;
        });
      }

      applyUi();
      return wrap;
    }

    function currentList() {
      var list = DATA.products;
      if (activeCategory === NONE) {
        list = list.filter(function (p) { return !p.category; });
      } else if (activeCategory !== ALL) {
        list = list.filter(function (p) { return p.category === activeCategory; });
      }
      var q = searchInput.value.trim().toLowerCase();
      if (q) {
        list = list.filter(function (p) {
          if (String(p.id).indexOf(q) !== -1 || p.name.toLowerCase().indexOf(q) !== -1) { return true; }
          var imgsN = productImages(p);
          for (var k = 0; k < imgsN.length; k++) {
            if (imageDetails(p, k).name.toLowerCase().indexOf(q) !== -1) { return true; }
          }
          return false;
        });
      }
      return list;
    }

    var catDropdownWrap = document.getElementById('catDropdownWrap');
    var catDropdownBtn = document.getElementById('catDropdownBtn');
    var catDropdownLabel = document.getElementById('catDropdownLabel');
    var catDropdownMenu = document.getElementById('catDropdownMenu');

    function closeCatDropdown() {
      catDropdownWrap.classList.remove('open');
    }

    function selectCategory(name) {
      activeCategory = name;
      Array.prototype.forEach.call(catTabs.children, function (c) {
        c.classList.toggle('active', c.textContent === name);
      });
      Array.prototype.forEach.call(catDropdownMenu.children, function (c) {
        c.classList.toggle('active', c.textContent === name);
      });
      catDropdownLabel.textContent = name === ALL ? 'الأقسام' : name;
      closeCatDropdown();
      render(currentList());
    }

    function buildTabs() {
      var cats = Array.isArray(DATA.categories) ? DATA.categories : [];
      catTabs.innerHTML = '';
      catDropdownMenu.innerHTML = '';

      if (cats.length === 0) {
        catDropdownWrap.style.display = 'none';
        return;
      }
      catDropdownWrap.style.display = '';

      var hasUncategorized = DATA.products.some(function (p) { return !p.category; });
      var names = [ALL].concat(cats).concat(hasUncategorized ? [NONE] : []);
      catDropdownLabel.textContent = activeCategory === ALL ? 'الأقسام' : activeCategory;

      names.forEach(function (name) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cat-tab' + (name === activeCategory ? ' active' : '');
        btn.textContent = name;
        btn.onclick = function () { selectCategory(name); };
        catTabs.appendChild(btn);

        var item = document.createElement('button');
        item.type = 'button';
        item.className = 'cat-dropdown-item' + (name === activeCategory ? ' active' : '');
        item.textContent = name;
        item.onclick = function () { selectCategory(name); };
        catDropdownMenu.appendChild(item);
      });
    }

    catDropdownBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      catDropdownWrap.classList.toggle('open');
    });

    document.addEventListener('click', function (e) {
      if (!catDropdownWrap.contains(e.target)) { closeCatDropdown(); }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeCatDropdown(); }
    });

    function render(list) {
      grid.innerHTML = '';
      bgToken++;
      bgItems = [];
      if (list.length === 0) {
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';
      list.forEach(function (p) {
        var card = document.createElement('div');
        card.className = 'card';

        var badge = document.createElement('div');
        badge.className = 'badge';
        badge.textContent = p.id;

        var info = document.createElement('div');
        info.className = 'info';
        function addRow(label, value, cls) {
          var row = document.createElement('p');
          row.className = 'info-row' + (cls ? ' ' + cls : '');
          var l = document.createElement('span');
          l.className = 'info-label';
          l.textContent = label + ': ';
          var v = document.createElement('span');
          v.className = 'info-value';
          v.textContent = value;
          row.appendChild(l);
          row.appendChild(v);
          info.appendChild(row);
        }

        var btn = document.createElement('a');
        btn.className = 'wa-btn';
        btn.target = '_blank';
        btn.rel = 'noopener';
        btn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 1.8a8.2 8.2 0 1 1-4.2 15.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 0 1 12 3.800zm-3.500 3.900c-.2 0-.5.1-.7.3-.3.3-1 1-1 2.300s1 2.700 1.200 2.900c.1.2 2 3.100 4.900 4.300 2.400 1 2.900.8 3.400.7.5 0 1.700-.7 1.900-1.300.2-.700.2-1.200.2-1.300-.1-.1-.3-.2-.6-.4l-2-1c-.3-.1-.5-.1-.7.2l-.9 1.100c-.2.2-.3.2-.6.1a6.700 6.700 0 0 1-3.300-2.900c-.2-.4.2-.4.7-1.300.1-.2 0-.3 0-.5l-.9-2.200c-.2-.5-.4-.5-.6-.5h-.5z"/></svg><span>اطلب عبر واتساب</span>';

        function showInfo(idx) {
          var d = imageDetails(p, idx);
          info.innerHTML = '';
          addRow('اسم العمل', d.name);
          if (d.size) { addRow('المقاس', d.size); }
          if (d.description) { addRow('وصف المنتج', d.description, 'info-desc'); }
          btn.href = buildWhatsappLink(p, idx);
        }

        var carousel = buildCarousel(p, showInfo);

        card.appendChild(badge);
        card.appendChild(carousel);
        card.appendChild(info);
        card.appendChild(btn);
        grid.appendChild(card);
      });
      var tk = bgToken;
      setTimeout(function () { startBackgroundLoading(tk); }, 50);
    }

    function applyData() {
      document.getElementById('siteTitle').textContent = DATA.title;
      document.getElementById('siteSubtitle').textContent = DATA.subtitle;
      document.getElementById('siteFooter').textContent = DATA.footer;
      document.title = DATA.title;
      grid.className = 'grid ' + (DATA.columns === 1 ? 'cols-1' : 'cols-2');
      buildTabs();
      render(currentList());
    }

    searchInput.addEventListener('input', function () {
      render(currentList());
    });

    fetch('data.json?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) { DATA = d; applyData(); })
      .catch(function () {
        emptyMsg.textContent = 'تعذر تحميل المنتجات، حدّث الصفحة';
        emptyMsg.style.display = 'block';
      });
  </script>
</body>
</html>
